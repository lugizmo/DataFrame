services:

  # GCC debug build and test image.
  gcc_debug:
    image: lugizmo-dataframe:gcc-debug
    build:
      context: .
      dockerfile: docker/linux_gcc.Dockerfile
      target: debug

  # GCC release build, test, install, and package-smoke image.
  gcc_release:
    image: lugizmo-dataframe:gcc-release
    build:
      context: .
      dockerfile: docker/linux_gcc.Dockerfile
      target: release

  # LLVM debug build and test image.
  llvm_debug:
    image: lugizmo-dataframe:llvm-debug
    build:
      context: .
      dockerfile: docker/linux_llvm.Dockerfile
      target: debug

  # LLVM release build, test, install, and package-smoke image.
  llvm_release:
    image: lugizmo-dataframe:llvm-release
    build:
      context: .
      dockerfile: docker/linux_llvm.Dockerfile
      target: release
